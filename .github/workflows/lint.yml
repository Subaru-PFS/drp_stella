name: Lint

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Pinned deliberately. A newer flake8 or plugin can introduce checks that fail
  # code which was clean when it was written; bump these in their own commit so
  # the resulting findings get reviewed on their own.
  FLAKE8_VERSION: "7.4.1"
  PEP8_NAMING_VERSION: "0.15.1"

jobs:
  flake8:
    name: flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # pep8-naming provides the N8xx checks that setup.cfg configures.
      - name: Install flake8
        run: python -m pip install "flake8==${FLAKE8_VERSION}" "pep8-naming==${PEP8_NAMING_VERSION}"

      # Configuration is in setup.cfg. Needs no stack: flake8 only parses the files.
      # Each finding is printed as a GitHub annotation, so it shows inline on the
      # PR's changed lines; the location is repeated in the message for the log.
      # The workspace is passed as an absolute path because the runner rewrites
      # absolute workspace paths to repo-relative ones, but passes flake8's
      # default "./..." paths through untouched. GitHub shows at most 10 error
      # annotations per step; the full list is always in the log.
      - name: Lint
        run: >-
          flake8 "$GITHUB_WORKSPACE"
          --format='::error file=%(path)s,line=%(row)d,col=%(col)d,title=flake8 %(code)s::%(path)s:%(row)d:%(col)d: %(code)s %(text)s'
