description: |
  Adjust detectorMap and fiberProfiles for a change in focus, using a PSF-matching kernel

  The data query should select two visits (arcs or sky): the reference (with
  the same focus as the imagePsf, detectorMap_calib and fiberProfiles) and the
  target. Set the reference visit with "-c parameters:referenceVisit=<visit>".
  The outputs (detectorMap_psfMatch, fiberProfiles_psfMatch) can be certified
  with certifyDetectorMaps.py and certifyFiberProfiles.py (with --datasetType).

  The blue arm has too few lines in sky exposures to measure a good kernel. To
  use the kernel measured for the red arm instead, first run for the red arm,
  and then run for the blue arm with "-c psfMatchCalibs:kernelArm=r", including
  the red-arm output collection in the inputs.
instrument: lsst.obs.pfs.PrimeFocusSpectrograph
parameters:
  referenceVisit: None
tasks:
  isr:
    class: lsst.obs.pfs.isrTask.PfsIsrTask
  cosmicray:
    class: pfs.drp.stella.cosmicray.CosmicRayTask
    config:
      grouping: separate
      doWriteExposure: true
  psfMatchCalibs:
    class: pfs.drp.stella.psfMatchCalibs.PsfMatchCalibsTask
    config:
      referenceVisit: parameters.referenceVisit
