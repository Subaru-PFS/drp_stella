description: |
  Adjust detectorMap and fiberProfiles for a change in focus, using a PSF-matching kernel

  The data query should select two visits (arcs or sky): the reference (with
  the same focus as the imagePsf, detectorMap_calib and fiberProfiles valid
  for it) and the target. Say which is which with
  "-c parameters:referenceIsLater=True" (the reference has the larger visit
  number) or False. The calibs valid for each visit are copied by the
  calibsForVisit task. The outputs (detectorMap_candidate,
  fiberProfiles_candidate) can be certified with certifyDetectorMaps.py and
  certifyFiberProfiles.py (with --datasetType fiberProfiles_candidate).

  By default (doWarp), the target is warped onto the reference before
  measuring the kernel, using the detectorMap_calib valid for the target and
  the reference's detectorMap_calib adjusted to the reference. Use
  "-c psfMatchCalibs:doWarp=False" to fit the shift with the kernel instead.

  The blue arm has too few lines in sky exposures to measure a good kernel. To
  use the kernel measured for the red arm instead, first run for the red arm,
  and then run for the blue arm with "-c psfMatchCalibs:kernelArm=r", including
  the red-arm output collection in the inputs.

  By default (doCheckTarget), lines and traces are measured on the target and
  compared with the new detectorMap; look for "Target measurements" in the log.
instrument: lsst.obs.pfs.PrimeFocusSpectrograph
parameters:
  referenceIsLater: None
tasks:
  isr:
    class: lsst.obs.pfs.isrTask.PfsIsrTask
  cosmicray:
    class: pfs.drp.stella.cosmicray.CosmicRayTask
    config:
      grouping: separate
      doWriteExposure: true
  calibsForVisit:
    class: pfs.drp.stella.pipelines.calibsForVisit.CalibsForVisitTask
  psfMatchCalibs:
    class: pfs.drp.stella.psfMatchCalibs.PsfMatchCalibsTask
    config:
      referenceIsLater: parameters.referenceIsLater
