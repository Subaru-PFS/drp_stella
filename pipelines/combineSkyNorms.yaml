description: Combine skyNorms residuals into skyNorms_calib
instrument: lsst.obs.pfs.PrimeFocusSpectrograph
imports:
  - $DRP_STELLA_DIR/pipelines/measureSkyNorms.yaml

tasks:
  reduceExposure:
    class: pfs.drp.stella.reduceExposure.ReduceExposureTask
    config:
      doApplySkyNorms: False
      doApplyPfiCorrection: True  # skyNorms_calib are measured relative to the PFI correction...
  skyNorms:
    class: pfs.drp.stella.skyNorms.MeasureSkyNormsTask
    config:
      doRemovePfiCorrection: False  # ... so don't remove it
      doRemoveBlackSpotCorrection: False  # (nor the black spot correction, which was also applied)
  combineSkyNorms:
    class: pfs.drp.stella.skyNorms.CombineSkyNormsTask
