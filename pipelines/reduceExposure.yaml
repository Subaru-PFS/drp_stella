description: |
  Reduce an exposure.
  For exposures of the sky, also measure the skyNorms (see MeasureSkyNormsTask),
  after removing the corrections applied after the fiberNorms (the PFI correction, including any
  skyNorms_calib, and the black spot correction), so they're raw.
instrument: lsst.obs.pfs.PrimeFocusSpectrograph

tasks:
  isr:
    class: lsst.obs.pfs.isrTask.PfsIsrTask
    config:
      h4.doCR: True                     # Detect CRs and ASIC/ROIC glitches up the ramp
      h4.maskCR: True                   # Flag CR pixels BAD: persistence biases the corrected flux
  cosmicray:
    class: pfs.drp.stella.cosmicray.CosmicRayTask
    config:
      doH4MorphologicalCRs: True
  reduceExposure:
    class: pfs.drp.stella.reduceExposure.ReduceExposureTask
    config:
      requireAdjustDetectorMap: True
  mergeArms:
    class: pfs.drp.stella.mergeArms.MergeArmsTask
  skyNorms:  # Exposures of the sky only;  measured after removing the PFI and black spot corrections
    class: pfs.drp.stella.skyNorms.MeasureSkyNormsTask
